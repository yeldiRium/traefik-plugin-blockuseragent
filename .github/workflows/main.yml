name: Main

on:
  push:
    branches:
      - main
    tags:
      - v*
  pull_request:

jobs:
  main:
    name: Main Process
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v16
        with:
          name: devenv
      - name: Install devenv.sh
        run: nix profile add nixpkgs#devenv

      - name: Run QA
        run: devenv test --no-tui
